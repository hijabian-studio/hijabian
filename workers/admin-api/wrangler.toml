name = "hijabian-admin-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Deployed URL:
# https://hijabian-admin-api.hijabianrebels.workers.dev

[vars]
GITHUB_OWNER = "hijabian-studio"
GITHUB_REPO = "hijabian"
GITHUB_BRANCH = "main"
# REQUIRED: set your real admin email(s), comma-separated, before deploy
# Example: ALLOWED_EMAILS = "you@example.com"
ALLOWED_EMAILS = ""

# Secrets (already or via dashboard / wrangler — never commit):
#   GITHUB_TOKEN          — required (you reported this is already set)
#   ADMIN_SHARED_SECRET   — optional; if set, requests must send header X-Admin-Secret
